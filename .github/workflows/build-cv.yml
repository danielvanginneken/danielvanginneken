name: Build & Release CV

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options: [major, minor, patch]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile CVs
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/cv \
            ghcr.io/xu-cheng/texlive-full:latest \
            sh -c '
              pdflatex -interaction=nonstopmode cv-en.tex &&
              pdflatex -interaction=nonstopmode cv-nl.tex
            '

      - name: Rename outputs
        run: |
          mv "cv/cv-en.pdf" "CV-DanielvanGinneken-EN.pdf"
          mv "cv/cv-nl.pdf" "CV-DanielvanGinneken-NL.pdf"

      - name: Determine next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName // "v0.0.0"' 2>/dev/null || echo "v0.0.0")
          VERSION=${LATEST#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2); MINOR=${MINOR:-0}
          PATCH=$(echo "$VERSION" | cut -d. -f3); PATCH=${PATCH:-0}
          BUMP=${{ inputs.bump || 'patch' }}
          case "$BUMP" in
            major) NEXT="v$((MAJOR+1)).0.0" ;;
            minor) NEXT="v${MAJOR}.$((MINOR+1)).0" ;;
            patch) NEXT="v${MAJOR}.${MINOR}.$((PATCH+1))" ;;
          esac
          echo "value=$NEXT" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: "CV — ${{ steps.version.outputs.value }}"
          make_latest: true
          body: |
            Built from commit ${{ github.sha }} on `${{ github.ref_name }}`.
          files: |
            CV-DanielvanGinneken-EN.pdf
            CV-DanielvanGinneken-NL.pdf
